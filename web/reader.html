<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>閱讀 · 臆想書房</title><link rel="icon" href="data:,"><link rel="stylesheet" href="css/reader.css"><script type="module" src="js/reader.js"></script></head>
<body class="reader-page" data-theme="dark"><script>try{const theme=JSON.parse(localStorage.getItem('imaginary-library:v1:reader:settings'))?.theme;if(['dark','light','warm'].includes(theme))document.body.dataset.theme=theme}catch{}</script>
<header class="site-header"><a class="reader-brand" href="index.html">臆想書房</a><div class="header-actions"><a id="back-to-work" class="text-link" href="index.html">作品詳情</a><button id="contents-button" class="text-button" type="button" aria-label="章節目錄">☰ <span class="desktop-label">目錄</span></button><button class="text-button language-toggle" data-language-toggle type="button" aria-label="切換為簡體中文">繁／簡</button><button id="settings-button" class="text-button" type="button" aria-label="閱讀設定">Aa</button></div></header>
<main class="reading-room"><h1 id="reader-title" class="visually-hidden"></h1><p id="reader-byline" class="visually-hidden"></p>
<div class="book-stage"><button id="prev" class="page-turn-control page-turn-prev" type="button" aria-label="上一頁">←</button><div id="book" class="book" data-localized-content aria-label="閱讀正文"></div><button id="next" class="page-turn-control page-turn-next" type="button" aria-label="下一頁">→</button></div><div id="scroll-content" class="scroll-content prose" data-localized-content hidden></div>
<nav class="reading-navigation" aria-label="閱讀進度"><div class="position"><span id="position" aria-live="polite"></span><div class="progress-track"><span id="progress"></span></div></div></nav><nav class="chapter-navigation" aria-label="章節導航"><a id="previous-chapter" class="chapter-nav-link" hidden>← 上一章</a><a id="next-chapter" class="chapter-nav-link" hidden>下一章 →</a></nav><p id="storage-status" class="storage-status" role="status"></p><p id="reader-error" class="library-status" role="alert"></p></main>
<footer class="room-footer"><span>一頁之間，自有天地。</span><span>GARY LEE <span class="footer-dot">·</span> 臆想書房</span></footer>
<dialog id="settings" class="panel"><form method="dialog" class="panel-head"><h2>閱讀設定</h2><button class="text-button" aria-label="關閉閱讀設定">✕</button></form><div class="panel-body">
<fieldset><legend>閱讀方式</legend><div class="segmented"><button data-mode="scroll">滾動</button><button data-mode="page">翻頁</button></div></fieldset>
<fieldset><legend>紙頁與光</legend><div class="theme-options"><button data-theme="dark"><i class="swatch dark"></i>夜讀</button><button data-theme="light"><i class="swatch light"></i>日光</button><button data-theme="warm"><i class="swatch warm"></i>暖紙</button></div></fieldset>
<label class="setting-row">字級<select id="font-size"><option value="18">18</option><option value="20">20</option><option value="22">22</option><option value="24">24</option></select></label>
<label class="setting-row">行距<select id="line-height"><option value="1.7">緊湊</option><option value="1.9">舒適</option><option value="2.1">寬鬆</option></select></label>
<label class="setting-row">字體<select id="font-family"><option value="serif">明體</option><option value="sans">黑體</option></select></label>
<label class="setting-row">翻頁效果<select id="motion"><option value="fold">輕摺頁</option><option value="fade">輕淡入</option><option value="none">無動畫</option></select></label><p class="panel-note">設定會保存在此瀏覽器。減少動態效果開啟時，書頁直接切換。</p></div></dialog>
<dialog id="contents" class="panel"><form method="dialog" class="panel-head"><h2>目錄</h2><button class="text-button" aria-label="關閉目錄">✕</button></form><div class="panel-body"><p id="contents-work" class="eyebrow"></p><div id="contents-chapters"></div></div></dialog>
<dialog id="note" class="note-dialog"><form method="dialog" class="panel-head"><h2>註釋</h2><button class="text-button" aria-label="關閉註釋">✕</button></form><p id="note-text" data-localized-content></p></dialog>
<details id="music-panel" class="music-panel" hidden><summary>♫ <span id="music-summary">延伸聆聽</span></summary><div class="music-body"><p class="music-label">本篇選曲</p><strong id="music-chapter-song"></strong><p id="music-now-playing" class="music-now-playing"></p><p id="music-status" class="music-status" role="status"></p><div class="music-deck" aria-hidden="true"><div id="music-vinyl" class="music-vinyl"></div><div id="music-needle" class="music-needle"></div></div><div class="music-controls"><button id="music-play" type="button" aria-label="播放音樂">▶</button><button id="music-switch" type="button" hidden>切換到本篇歌曲</button></div><label class="music-slider">播放進度 <input id="music-seek" type="range" min="0" max="1000" value="0"></label><div class="music-time"><span id="music-current">0:00</span><span id="music-duration">0:00</span></div><div class="music-extra"><label>音量 <input id="music-volume" type="range" min="0" max="100" value="70"></label><label class="music-file-label" for="music-file">選擇本機 MP3</label><input id="music-file" type="file" accept="audio/mpeg,.mp3" multiple></div><audio id="music-audio" preload="none"></audio></div></details>
</body></html>
